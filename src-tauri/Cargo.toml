[package]
name = "maf-v3-desktop"
version = "3.0.0"
description = "MAF V3 desktop research preview"
authors = ["Evolution Unleashed", "Stu Jordan"]
license = "MIT"
edition = "2024"
rust-version = "1.88"

[build-dependencies]
sha2 = "=0.10.9"
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
dunce = "=1.0.5"
getrandom = "=0.4.3"
hmac = "=0.12.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-dialog = "=2.7.2"
tauri-plugin-opener = "=2.5.4"
tauri-plugin-single-instance = "=2.4.3"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
] }

# Cargo resolves all target graphs into one lockfile. These mature exact pins
# keep the transitive WebAssembly family inside the same seven-day quarantine
# as the Windows crates, even though the desktop binary does not build them.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "=0.3.103"
wasm-bindgen = "=0.2.126"
wasm-bindgen-futures = "=0.4.76"
web-sys = "=0.3.103"

# These are resolver constraints for mature transitive releases. `cfg(any())`
# is never built, but Cargo still records the exact compatible versions in the
# all-target lockfile so a regeneration cannot silently select a quarantined
# publication.
[target.'cfg(any())'.dependencies]
async-trait = "=0.1.91"
cc = "=1.4.0"
cookie = "=0.18.1"
find-msvc-tools = "=0.1.9"
futures-channel = "=0.3.33"
futures-core = "=0.3.33"
futures-executor = "=0.3.33"
futures-io = "=0.3.33"
futures-macro = "=0.3.33"
futures-sink = "=0.3.33"
futures-task = "=0.3.33"
futures-util = "=0.3.33"
open = "=5.4.0"
# Advisory fixes: plist 1.10 moves its parser to patched quick-xml 0.41;
# time 0.3.47 fixes the RFC2822 parser stack-exhaustion advisory.
plist = "=1.10.0"
quick-xml = "=0.41.0"
time = "=0.3.47"
thiserror = "=2.0.19"
thiserror-impl = "=2.0.19"
web_atoms = "=0.2.5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
