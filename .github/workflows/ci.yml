name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify, test, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out the exact triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify pnpm bootstrap before download
        run: node scripts/security-verify-bootstrap.mjs

      - name: Install pinned pnpm and Node without npm
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          version: 11.16.0
          runtime: node@24.18.0
          install: false
          cache: false

      - name: Confirm toolchain pins
        shell: bash
        run: |
          test "$(pnpm --version)" = "11.16.0"
          test "$(node --version)" = "v24.18.0"

      - name: Verify repository security policy
        run: node scripts/security-verify-config.mjs

      - name: Verify every locked version before install
        run: node scripts/security-verify-lock.mjs

      - name: Verify every Rust crate before fetch
        run: node scripts/security-verify-cargo-lock.mjs

      - name: Install quarantined dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit known high-severity vulnerabilities
        run: pnpm audit --audit-level=high

      - name: Type-check
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Build unsigned output
        run: pnpm build

  rust-advisories:
    name: RustSec advisory audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
    steps:
      - name: Check out the exact triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit Cargo.lock against RustSec
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ github.token }}
          working-directory: src-tauri
