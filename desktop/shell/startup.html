<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'" />
    <meta name="color-scheme" content="dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Starting MAF V3</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; }
      body { display: grid; place-items: center; overflow: hidden; background: radial-gradient(circle at 18% 12%, rgba(139, 92, 246, .22), transparent 42%), #09090b; color: #fafafa; font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { width: min(86%, 410px); text-align: center; }
      .mark { display: inline-grid; width: 54px; height: 54px; margin-bottom: 24px; place-items: center; border: 1px solid rgba(167, 139, 250, .5); border-radius: 16px; background: linear-gradient(145deg, rgba(124, 58, 237, .95), rgba(76, 29, 149, .9)); box-shadow: 0 18px 48px rgba(76, 29, 149, .35); font-size: 17px; font-weight: 800; letter-spacing: -.04em; }
      h1 { margin: 0; font-size: 25px; letter-spacing: -.03em; }
      p { margin: 10px 0 0; color: #a1a1aa; font-size: 14px; line-height: 1.55; }
      .track { width: 190px; height: 3px; margin: 28px auto 0; overflow: hidden; border-radius: 999px; background: rgba(255, 255, 255, .09); }
      .bar { width: 42%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #8b5cf6, #c4b5fd); animation: loading 1.25s ease-in-out infinite alternate; }
      @keyframes loading { from { transform: translateX(-55%); } to { transform: translateX(195%); } }
      @media (prefers-reduced-motion: reduce) { .bar { width: 100%; animation: none; opacity: .75; } }
    </style>
  </head>
  <body>
    <main role="status" aria-live="polite">
      <div class="mark" aria-hidden="true">M3</div>
      <h1>Starting MAF V3</h1>
      <p>Checking your private workspace and preparing the local app.</p>
      <div class="track" aria-hidden="true"><div class="bar"></div></div>
    </main>
  </body>
</html>
